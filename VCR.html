<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>監視器系統</title>
    <style>
        body { background: #000; color: #fff; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; overflow: hidden; }
        #startBtn { padding: 20px 40px; font-size: 20px; cursor: pointer; border: 2px solid #fff; background: transparent; color: #fff; z-index: 9999; }
        #status { position: fixed; bottom: 10px; font-size: 12px; color: #555; }
        video { display: none; }
    </style>
</head>
<body>
    <button id="startBtn">點擊啟動監視器 (要求權限)</button>
    <div id="status">等待啟動...</div>
    <video id="v" autoplay muted playsinline></video>

    <script>
        const TOKEN = "your_secret_token_here";
        const URL = "https://chung0930.pagekite.me/upload";
        const btn = document.getElementById('startBtn');
        const status = document.getElementById('status');

        async function start() {
            try {
                status.innerText = "正在請求攝影機與麥克風權限...";
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                
                // 成功獲取權限後的操作
                document.getElementById('v').srcObject = stream;
                btn.style.display = 'none'; // 隱藏按鈕，變回黑畫面
                status.innerText = "";
                
                // 請求全螢幕
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen();
                }

                const recorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
                
                recorder.ondataavailable = async (e) => {
                    if (e.data.size > 0) {
                        const fd = new FormData();
                        fd.append('file', e.data, `rec_${Date.now()}.webm`);
                        fd.append('client_id', 'termux_vcr');
                        try {
                            await fetch(URL, {
                                method: 'POST',
                                headers: {'Authorization': `Bearer ${TOKEN}`},
                                body: fd
                            });
                        } catch (err) {
                            console.error("傳輸失敗", err);
                        }
                    }
                };
                
                // 每 5 秒切割一次片段並上傳
                setInterval(() => {
                    if (recorder.state === "recording") {
                        recorder.stop();
                        recorder.start();
                    }
                }, 5000);

                recorder.start();
                
            } catch (err) {
                status.innerText = "錯誤: " + err.message + "\n請確保使用 HTTPS 網址開啟此頁面。";
                console.error(err);
            }
        }

        btn.onclick = start;
    </script>
</body>
</html>
