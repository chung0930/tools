<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Data Transfer - 視覺化光學高速檔案傳輸</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, sans-serif; }
        .grid-canvas { background: #000; image-rendering: pixelated; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4">

    <!-- Header -->
    <header class="w-full max-w-md text-center py-2 border-b border-slate-700">
        <h1 class="text-xl font-bold text-cyan-400">⚡ Visual Data Transfer</h1>
        <p class="text-xs text-slate-400">光學高速動態雜訊檔案傳輸系統</p>
    </header>

    <!-- Mode Selector Tab -->
    <div class="flex w-full max-w-md my-3 bg-slate-800 p-1 rounded-xl">
        <button id="tabTx" onclick="switchTab('tx')" class="flex-1 py-2 rounded-lg font-semibold text-sm transition bg-cyan-600 text-white">
            📤 發送端 (Transmitter)
        </button>
        <button id="tabRx" onclick="switchTab('rx')" class="flex-1 py-2 rounded-lg font-semibold text-sm transition text-slate-400">
            📥 接收端 (Receiver)
        </button>
    </div>

    <!-- MAIN TRANSMITTER SECTION -->
    <main id="txSection" class="w-full max-w-md flex flex-col items-center gap-4">
        <div class="w-full bg-slate-800/80 p-4 rounded-xl border border-slate-700 space-y-3">
            <div>
                <label class="block text-xs text-slate-400 mb-1">選擇檔案</label>
                <input type="file" id="fileInput" class="block w-full text-xs text-slate-300 file:mr-3 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-cyan-900/50 file:text-cyan-300 hover:file:bg-cyan-800"/>
            </div>

            <div class="grid grid-cols-2 gap-2 text-xs">
                <div>
                    <label class="text-slate-400">每秒幀數 (FPS): <span id="fpsVal" class="text-cyan-400 font-bold">30</span></label>
                    <input type="range" id="fpsRange" min="5" max="60" value="30" class="w-full accent-cyan-500" oninput="document.getElementById('fpsVal').innerText=this.value">
                </div>
                <div>
                    <label class="text-slate-400">陣列密度 (Grid): <span id="gridVal" class="text-cyan-400 font-bold">16x16</span></label>
                    <input type="range" id="gridRange" min="8" max="32" step="4" value="16" class="w-full accent-cyan-500" oninput="document.getElementById('gridVal').innerText=this.value+'x'+this.value">
                </div>
            </div>

            <button id="startTxBtn" onclick="toggleTx()" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 font-bold text-sm rounded-lg shadow-lg transition">
                ▶ 開始光學發送
            </button>
        </div>

        <!-- Canvas Output Area -->
        <div class="relative w-full aspect-square bg-black rounded-xl overflow-hidden flex items-center justify-center border-2 border-slate-700">
            <canvas id="txCanvas" class="w-full h-full grid-canvas"></canvas>
            <div id="txPlaceholder" class="absolute text-slate-500 text-xs text-center p-4">
                請選擇檔案並點擊開始<br>畫面將產生高頻光學數據雜訊圖樣
            </div>
        </div>

        <!-- Transmission Info -->
        <div class="w-full bg-slate-800/50 p-3 rounded-lg text-xs space-y-1 border border-slate-700/50">
            <div class="flex justify-between"><span>檔案名稱:</span><span id="txFileName" class="font-mono text-cyan-300">-</span></div>
            <div class="flex justify-between"><span>總封包數 (Chunks):</span><span id="txTotalChunks" class="font-mono text-cyan-300">0</span></div>
            <div class="flex justify-between"><span>即時傳輸幀率:</span><span id="txActualFps" class="font-mono text-cyan-300">0 FPS</span></div>
        </div>
    </main>

    <!-- MAIN RECEIVER SECTION -->
    <main id="rxSection" class="w-full max-w-md flex flex-col items-center gap-4 hidden">
        <div class="w-full bg-slate-800/80 p-3 rounded-xl border border-slate-700 space-y-2">
            <button id="cameraBtn" onclick="toggleCamera()" class="w-full py-2.5 bg-cyan-600 hover:bg-cyan-500 font-bold text-sm rounded-lg shadow-lg transition">
                📷 開啟相機進行鏡頭掃描
            </button>
        </div>

        <!-- Video & Scanner Canvas Area -->
        <div class="relative w-full aspect-square bg-black rounded-xl overflow-hidden flex items-center justify-center border-2 border-slate-700">
            <video id="webcam" playsinline class="absolute w-full h-full object-cover"></video>
            <canvas id="rxCanvas" class="absolute w-full h-full pointer-events-none"></canvas>
            <div id="rxPlaceholder" class="absolute text-slate-500 text-xs text-center p-4">
                按下開啟相機對準發送端螢幕
            </div>
        </div>

        <!-- Realtime Statistics Board -->
        <div class="w-full bg-slate-800/80 p-4 rounded-xl border border-slate-700 space-y-2">
            <div class="flex justify-between items-center">
                <span class="text-xs text-slate-400">接收總進度</span>
                <span id="rxPercent" class="text-base font-extrabold text-cyan-400">0%</span>
            </div>
            <!-- Progress Bar -->
            <div class="w-full bg-slate-900 rounded-full h-2.5 overflow-hidden">
                <div id="rxProgressBar" class="bg-gradient-to-r from-cyan-500 to-emerald-400 h-2.5 rounded-full w-0 transition-all duration-100"></div>
            </div>

            <div class="grid grid-cols-2 gap-2 text-xs pt-2 border-t border-slate-700/50">
                <div>即時速率: <span id="rxSpeed" class="font-mono font-bold text-emerald-400">0 KB/s</span></div>
                <div>已解碼區塊: <span id="rxChunks" class="font-mono text-cyan-300">0 / 0</span></div>
                <div>估算剩餘時間: <span id="rxEta" class="font-mono text-cyan-300">-- s</span></div>
                <div>品質 / 讀取率: <span id="rxFps" class="font-mono text-cyan-300">0 FPS</span></div>
            </div>

            <!-- Download Button -->
            <a id="downloadBtn" class="hidden block w-full text-center py-2 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-extrabold text-sm rounded-lg shadow-lg transition mt-2">
                💾 傳輸完成！點擊下載檔案
            </a>
        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full max-w-md text-center text-[10px] text-slate-500 my-2">
        High-Frequency Optical Pattern Transfer Protocol • Local Memory Native Execution
    </footer>

    <script>
        // Tab Switcher
        function switchTab(mode) {
            const txSection = document.getElementById('txSection');
            const rxSection = document.getElementById('rxSection');
            const tabTx = document.getElementById('tabTx');
            const tabRx = document.getElementById('tabRx');

            if (mode === 'tx') {
                txSection.classList.remove('hidden');
                rxSection.classList.add('hidden');
                tabTx.className = "flex-1 py-2 rounded-lg font-semibold text-sm transition bg-cyan-600 text-white";
                tabRx.className = "flex-1 py-2 rounded-lg font-semibold text-sm transition text-slate-400";
                stopCamera();
            } else {
                txSection.classList.add('hidden');
                rxSection.classList.remove('hidden');
                tabRx.className = "flex-1 py-2 rounded-lg font-semibold text-sm transition bg-cyan-600 text-white";
                tabTx.className = "flex-1 py-2 rounded-lg font-semibold text-sm transition text-slate-400";
                stopTx();
            }
        }

        // =========================================================================
        // TRANSMITTER (TX) LOGIC
        // =========================================================================
        let txInterval = null;
        let fileData = null;
        let chunks = [];
        let currentChunkIndex = 0;
        let txIsRunning = false;
        let txLastTime = performance.now();
        let txFrameCount = 0;

        async function toggleTx() {
            if (txIsRunning) {
                stopTx();
            } else {
                await startTx();
            }
        }

        async function startTx() {
            const fileInput = document.getElementById('fileInput');
            if (!fileInput.files.length) {
                alert('請先選擇要傳輸的檔案！');
                return;
            }

            const file = fileInput.files[0];
            document.getElementById('txFileName').innerText = file.name;
            document.getElementById('txPlaceholder').classList.add('hidden');

            const buffer = await file.arrayBuffer();
            fileData = new Uint8Array(buffer);

            const gridDim = parseInt(document.getElementById('gridRange').value);
            // Reserve perimeter/corners for sync and headers
            const availableCells = (gridDim * gridDim) - (gridDim * 4) - 16; 
            const bytesPerChunk = Math.max(8, Math.floor(availableCells / 8));

            // Split into Chunks
            chunks = [];
            const totalChunks = Math.ceil(fileData.length / bytesPerChunk);
            document.getElementById('txTotalChunks').innerText = totalChunks;

            const encoder = new TextEncoder();
            const nameBytes = encoder.encode(file.name);

            // Chunk format: [Marker(1B), TotalChunk(2B), ChunkID(2B), Data...]
            for (let i = 0; i < totalChunks; i++) {
                const start = i * bytesPerChunk;
                const end = Math.min(fileData.length, start + bytesPerChunk);
                const chunkBody = fileData.subarray(start, end);

                // Add header info
                const payload = new Uint8Array(5 + (i === 0 ? nameBytes.length + 1 : 0) + chunkBody.length);
                payload[0] = 0xA5; // Sync byte
                payload[1] = (totalChunks >> 8) & 0xFF;
                payload[2] = totalChunks & 0xFF;
                payload[3] = (i >> 8) & 0xFF;
                payload[4] = i & 0xFF;

                let offset = 5;
                if (i === 0) {
                    payload[offset] = nameBytes.length;
                    payload.set(nameBytes, offset + 1);
                    offset += 1 + nameBytes.length;
                }
                payload.set(chunkBody, offset);

                chunks.push(payload);
            }

            txIsRunning = true;
            document.getElementById('startTxBtn').innerText = '⏹ 停止傳輸';
            document.getElementById('startTxBtn').className = "w-full py-2.5 bg-rose-600 hover:bg-rose-500 font-bold text-sm rounded-lg shadow-lg transition";

            const targetFps = parseInt(document.getElementById('fpsRange').value);
            const intervalMs = 1000 / targetFps;

            currentChunkIndex = 0;
            txLastTime = performance.now();
            txFrameCount = 0;

            txInterval = setInterval(() => {
                renderChunkToCanvas(chunks[currentChunkIndex], gridDim);
                currentChunkIndex = (currentChunkIndex + 1) % chunks.length;

                txFrameCount++;
                const now = performance.now();
                if (now - txLastTime >= 1000) {
                    document.getElementById('txActualFps').innerText = `${txFrameCount} FPS`;
                    txFrameCount = 0;
                    txLastTime = now;
                }
            }, intervalMs);
        }

        function stopTx() {
            if (txInterval) clearInterval(txInterval);
            txIsRunning = false;
            document.getElementById('startTxBtn').innerText = '▶ 開始光學發送';
            document.getElementById('startTxBtn').className = "w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 font-bold text-sm rounded-lg shadow-lg transition";
        }

        function renderChunkToCanvas(payload, gridDim) {
            const canvas = document.getElementById('txCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = gridDim * 20;
            canvas.height = gridDim * 20;
            const cellSize = 20;

            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Convert payload bytes to bits
            let bitArray = [];
            for (let b of payload) {
                for (let i = 7; i >= 0; i--) {
                    bitArray.push((b >> i) & 1);
                }
            }

            let bitIdx = 0;
            for (let r = 0; r < gridDim; r++) {
                for (let c = 0; c < gridDim; c++) {
                    // Position Sync Anchors (Corners)
                    if ((r < 2 && c < 2) || (r < 2 && c >= gridDim - 2) || (r >= gridDim - 2 && c < 2)) {
                        ctx.fillStyle = '#000000';
                        ctx.fillRect(c * cellSize, r * cellSize, cellSize, cellSize);
                        continue;
                    }

                    // Border Alignment Patterns
                    if (r === 0 || c === 0 || r === gridDim - 1 || c === gridDim - 1) {
                        ctx.fillStyle = ((r + c) % 2 === 0) ? '#000000' : '#FFFFFF';
                        ctx.fillRect(c * cellSize, r * cellSize, cellSize, cellSize);
                        continue;
                    }

                    // Data Matrix Elements
                    if (bitIdx < bitArray.length) {
                        ctx.fillStyle = bitArray[bitIdx] === 1 ? '#000000' : '#FFFFFF';
                        bitIdx++;
                    } else {
                        ctx.fillStyle = '#FFFFFF';
                    }
                    ctx.fillRect(c * cellSize, r * cellSize, cellSize, cellSize);
                }
            }
        }

        // =========================================================================
        // RECEIVER (RX) LOGIC
        // =========================================================================
        let videoStream = null;
        let rxAnimFrame = null;
        let receivedChunks = new Map();
        let totalExpectedChunks = 0;
        let rxFileName = 'received_file.bin';
        let rxStartTime = null;
        let totalReceivedBytes = 0;
        let rxFrameCount = 0;
        let rxLastFpsTime = performance.now();

        async function toggleCamera() {
            if (videoStream) {
                stopCamera();
            } else {
                await startCamera();
            }
        }

        async function startCamera() {
            try {
                videoStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
                });
                const video = document.getElementById('webcam');
                video.srcObject = videoStream;
                await video.play();

                document.getElementById('rxPlaceholder').classList.add('hidden');
                document.getElementById('cameraBtn').innerText = '⏹ 關閉相機';
                document.getElementById('cameraBtn').className = "w-full py-2.5 bg-rose-600 hover:bg-rose-500 font-bold text-sm rounded-lg shadow-lg transition";

                rxStartTime = performance.now();
                processCameraFrame();
            } catch (err) {
                alert('無法取得相機存取權限: ' + err.message);
            }
        }

        function stopCamera() {
            if (videoStream) {
                videoStream.getTracks().forEach(t => t.stop());
                videoStream = null;
            }
            if (rxAnimFrame) cancelAnimationFrame(rxAnimFrame);
            document.getElementById('cameraBtn').innerText = '📷 開啟相機進行鏡頭掃描';
            document.getElementById('cameraBtn').className = "w-full py-2.5 bg-cyan-600 hover:bg-cyan-500 font-bold text-sm rounded-lg shadow-lg transition";
        }

        function processCameraFrame() {
            const video = document.getElementById('webcam');
            const canvas = document.getElementById('rxCanvas');
            const ctx = canvas.getContext('2d');

            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                // Sample matrix scanning over frame center
                scanOpticalData(ctx, canvas.width, canvas.height);

                // Frame rate meter
                rxFrameCount++;
                const now = performance.now();
                if (now - rxLastFpsTime >= 1000) {
                    document.getElementById('rxFps').innerText = `${rxFrameCount} FPS`;
                    rxFrameCount = 0;
                    rxLastFpsTime = now;
                }
            }

            rxAnimFrame = requestAnimationFrame(processCameraFrame);
        }

        function scanOpticalData(ctx, width, height) {
            // Adaptive sampling area in the middle of camera view
            const scanSize = Math.min(width, height) * 0.6;
            const startX = (width - scanSize) / 2;
            const startY = (height - scanSize) / 2;

            // Draw target box guide
            ctx.strokeStyle = '#00ffcc';
            ctx.lineWidth = 3;
            ctx.strokeRect(startX, startY, scanSize, scanSize);

            const imgData = ctx.getImageData(startX, startY, scanSize, scanSize);
            const gridDim = parseInt(document.getElementById('gridRange').value);
            const cellPx = scanSize / gridDim;

            let bits = [];
            for (let r = 0; r < gridDim; r++) {
                for (let c = 0; c < gridDim; c++) {
                    // Skip Border Sync Points
                    if ((r < 2 && c < 2) || (r < 2 && c >= gridDim - 2) || (r >= gridDim - 2 && c < 2)) continue;
                    if (r === 0 || c === 0 || r === gridDim - 1 || c === gridDim - 1) continue;

                    // Sample cell center pixel color
                    const cx = Math.floor((c + 0.5) * cellPx);
                    const cy = Math.floor((r + 0.5) * cellPx);
                    const idx = (cy * Math.floor(scanSize) + cx) * 4;

                    const rVal = imgData.data[idx];
                    const gVal = imgData.data[idx + 1];
                    const bVal = imgData.data[idx + 2];
                    const brightness = (rVal + gVal + bVal) / 3;

                    bits.push(brightness < 110 ? 1 : 0); // Binarization Threshold
                }
            }

            // Decode Bits to Payload Bytes
            let bytes = [];
            for (let i = 0; i < bits.length; i += 8) {
                if (i + 8 <= bits.length) {
                    let byteVal = 0;
                    for (let b = 0; b < 8; b++) {
                        byteVal = (byteVal << 1) | bits[i + b];
                    }
                    bytes.push(byteVal);
                }
            }

            // Validate Payload Marker
            if (bytes.length > 5 && bytes[0] === 0xA5) {
                const total = (bytes[1] << 8) | bytes[2];
                const chunkId = (bytes[3] << 8) | bytes[4];

                if (total > 0 && chunkId < total) {
                    totalExpectedChunks = total;

                    let payloadOffset = 5;
                    if (chunkId === 0 && !receivedChunks.has(0)) {
                        const nameLen = bytes[5];
                        const nameBytes = new Uint8Array(bytes.slice(6, 6 + nameLen));
                        rxFileName = new TextDecoder().decode(nameBytes);
                        payloadOffset = 6 + nameLen;
                    }

                    const chunkContent = new Uint8Array(bytes.slice(payloadOffset));
                    if (!receivedChunks.has(chunkId)) {
                        receivedChunks.set(chunkId, chunkContent);
                        totalReceivedBytes += chunkContent.length;
                        updateRxStats();
                    }
                }
            }
        }

        function updateRxStats() {
            if (totalExpectedChunks === 0) return;

            const progress = (receivedChunks.size / totalExpectedChunks) * 100;
            document.getElementById('rxPercent').innerText = `${progress.toFixed(1)}%`;
            document.getElementById('rxProgressBar').style.width = `${progress}%`;
            document.getElementById('rxChunks').innerText = `${receivedChunks.size} / ${totalExpectedChunks}`;

            // Calculate transfer speed & ETA
            const elapsedSec = (performance.now() - rxStartTime) / 1000;
            if (elapsedSec > 0) {
                const speedKB = (totalReceivedBytes / 1024) / elapsedSec;
                document.getElementById('rxSpeed').innerText = `${speedKB.toFixed(1)} KB/s`;

                const remainingBytes = (totalExpectedChunks - receivedChunks.size) * (totalReceivedBytes / receivedChunks.size);
                const etaSec = speedKB > 0 ? (remainingBytes / 1024) / speedKB : 0;
                document.getElementById('rxEta').innerText = `${Math.ceil(etaSec)} s`;
            }

            // Transfer Complete
            if (receivedChunks.size === totalExpectedChunks) {
                triggerDownload();
            }
        }

        function triggerDownload() {
            stopCamera();

            // Reconstruct total payload
            let totalLength = 0;
            for (let i = 0; i < totalExpectedChunks; i++) {
                totalLength += receivedChunks.get(i).length;
            }

            const completeFile = new Uint8Array(totalLength);
            let offset = 0;
            for (let i = 0; i < totalExpectedChunks; i++) {
                const chunk = receivedChunks.get(i);
                completeFile.set(chunk, offset);
                offset += chunk.length;
            }

            const blob = new Blob([completeFile], { type: 'application/octet-stream' });
            const url = URL.createObjectURL(blob);
            const downloadBtn = document.getElementById('downloadBtn');
            downloadBtn.href = url;
            downloadBtn.download = rxFileName || 'received_file.bin';
            downloadBtn.classList.remove('hidden');
        }
    </script>
</body>
</html>
