<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>光學檔案傳輸</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsqr/1.4.0/jsQR.js"></script>
<style>
  :root{
    --bg:#0b0d12;
    --panel:#151822;
    --panel2:#1c202c;
    --line:#2a2f3d;
    --text:#eef0f4;
    --sub:#8a90a2;
    --accent:#5ee6c0;
    --accent2:#7c9bff;
    --warn:#ff8a65;
    --mono:'SF Mono',ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang TC","Microsoft JhengHei",sans-serif;
    -webkit-tap-highlight-color:transparent;}
  body{min-height:100vh;padding:16px;padding-bottom:40px;}
  .wrap{max-width:520px;margin:0 auto;}
  h1{font-size:19px;font-weight:700;margin:4px 0 2px;letter-spacing:.2px}
  .tagline{color:var(--sub);font-size:13px;margin-bottom:16px}

  .tabs{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:16px;}
  .tab{flex:1;text-align:center;padding:10px 0;border-radius:10px;font-size:14px;font-weight:600;color:var(--sub);cursor:pointer;transition:.15s;}
  .tab.active{background:var(--accent);color:#0b0d12;}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;}
  .card h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--sub);margin:0 0 12px;font-weight:700;}

  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;}
  .row label{font-size:13px;color:var(--sub);flex-shrink:0;}
  .row .val{font-family:var(--mono);font-size:13px;color:var(--accent);}
  input[type=range]{flex:1;accent-color:var(--accent);}

  .filebtn{display:block;width:100%;text-align:center;padding:14px;border-radius:12px;border:1.5px dashed var(--line);
    color:var(--sub);font-size:14px;cursor:pointer;background:var(--panel2);transition:.15s;}
  .filebtn:hover{border-color:var(--accent);color:var(--text);}
  #fileInput{display:none;}
  .fileinfo{font-size:13px;color:var(--text);margin-top:8px;font-family:var(--mono);word-break:break-all;}

  button.main{width:100%;padding:14px;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;
    background:var(--accent);color:#0b0d12;transition:.15s;}
  button.main:active{transform:scale(.98);}
  button.main.stop{background:var(--warn);}
  button.main:disabled{background:var(--line);color:var(--sub);cursor:not-allowed;}
  button.ghost{width:100%;padding:12px;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;
    background:transparent;border:1px solid var(--line);color:var(--sub);margin-top:8px;}

  .qrbox{background:#fff;border-radius:14px;padding:14px;display:flex;align-items:center;justify-content:center;
    aspect-ratio:1/1;overflow:hidden;}
  #qrTarget{width:100%;}
  #qrTarget img,#qrTarget canvas{width:100% !important;height:100% !important;image-rendering:pixelated;}

  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;}
  .stat{background:var(--panel2);border-radius:10px;padding:10px 12px;}
  .stat .k{font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:.05em;}
  .stat .v{font-size:17px;font-weight:700;font-family:var(--mono);color:var(--accent);margin-top:2px;}
  .stat .v.blue{color:var(--accent2);}

  .progress-outer{height:8px;background:var(--panel2);border-radius:6px;overflow:hidden;margin-top:10px;}
  .progress-inner{height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));width:0%;transition:width .15s;}

  .camwrap{position:relative;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:3/4;}
  video{width:100%;height:100%;object-fit:cover;display:block;}
  canvas.overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
  .scan-hint{position:absolute;top:10px;left:10px;right:10px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;
    padding:6px 10px;border-radius:8px;text-align:center;backdrop-filter:blur(4px);}

  .download{display:none;text-align:center;padding:20px;background:var(--panel2);border-radius:14px;margin-top:12px;}
  .download.show{display:block;}
  .download a{display:inline-block;margin-top:10px;padding:12px 22px;background:var(--accent);color:#0b0d12;
    text-decoration:none;font-weight:700;border-radius:10px;font-size:14px;}
  .download .fname{font-family:var(--mono);font-size:13px;color:var(--text);word-break:break-all;}
  .download .fsize{color:var(--sub);font-size:12px;margin-top:2px;}

  .hidden{display:none !important;}
  .small{font-size:12px;color:var(--sub);line-height:1.5;margin-top:6px;}
  select{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>📡 光學檔案傳輸</h1>
  <div class="tagline">用一支手機的螢幕閃 QR code,另一支手機的相機拍 — 不需要網路連線</div>

  <div class="tabs">
    <div class="tab active" id="tabSend">傳送</div>
    <div class="tab" id="tabRecv">接收</div>
  </div>

  <!-- SEND -->
  <div id="panelSend">
    <div class="card">
      <h2>選擇檔案</h2>
      <label class="filebtn" id="fileBtn">點一下選擇要傳送的檔案</label>
      <input type="file" id="fileInput">
      <div class="fileinfo" id="fileInfo"></div>
    </div>

    <div class="card">
      <h2>傳輸設定</h2>
      <div class="row">
        <label>每塊大小</label>
        <input type="range" id="chunkSize" min="200" max="1200" step="50" value="500">
        <span class="val" id="chunkSizeVal">500 B</span>
      </div>
      <div class="row">
        <label>切換間隔</label>
        <input type="range" id="interval" min="0" max="300" step="10" value="80">
        <span class="val" id="intervalVal">80 ms</span>
      </div>
      <div class="small">間隔越小理論速度越快,但要對面相機拍得到才算數 — 建議先從預設值開始,掃不到就把間隔調大。</div>
    </div>

    <div class="card">
      <div class="qrbox"><div id="qrTarget"></div></div>
      <div class="stat-grid">
        <div class="stat"><div class="k">目前畫面</div><div class="v" id="sFrame">–</div></div>
        <div class="stat"><div class="k">已循環</div><div class="v blue" id="sLoop">0</div></div>
        <div class="stat"><div class="k">理論速率</div><div class="v" id="sRate">–</div></div>
        <div class="stat"><div class="k">實際刷新率</div><div class="v blue" id="sFps">–</div></div>
      </div>
      <button class="main" id="sendBtn" style="margin-top:14px;" disabled>開始傳送</button>
    </div>
  </div>

  <!-- RECEIVE -->
  <div id="panelRecv" class="hidden">
    <div class="card">
      <h2>相機</h2>
      <div class="row" style="margin-bottom:12px;">
        <label>鏡頭</label>
        <select id="cameraFacing">
          <option value="environment">後鏡頭(對準另一支手機)</option>
          <option value="user">前鏡頭</option>
        </select>
      </div>
      <div class="camwrap">
        <video id="video" playsinline muted></video>
        <canvas class="overlay" id="overlay"></canvas>
        <div class="scan-hint" id="scanHint">尚未啟動相機</div>
      </div>
      <button class="main" id="camBtn" style="margin-top:12px;">開啟相機開始接收</button>
    </div>

    <div class="card" id="progressCard">
      <h2>接收進度</h2>
      <div class="stat-grid">
        <div class="stat"><div class="k">檔名</div><div class="v" id="rName" style="font-size:13px;">–</div></div>
        <div class="stat"><div class="k">收到區塊</div><div class="v" id="rChunks">0 / –</div></div>
        <div class="stat"><div class="k">即時速率</div><div class="v" id="rRate">0 KB/s</div></div>
        <div class="stat"><div class="k">已用時間</div><div class="v blue" id="rTime">0.0s</div></div>
      </div>
      <div class="progress-outer"><div class="progress-inner" id="rProgress"></div></div>
    </div>

    <div class="download" id="downloadCard">
      <div>✅ 傳輸完成</div>
      <div class="fname" id="dName"></div>
      <div class="fsize" id="dSize"></div>
      <a id="dLink" download>下載檔案</a>
      <button class="ghost" id="resetRecvBtn">重新接收下一個檔案</button>
    </div>
  </div>
</div>

<script>
/* ============ 共用工具 ============ */
function fmtBytes(n){
  if(n<1024) return n+' B';
  if(n<1024*1024) return (n/1024).toFixed(1)+' KB';
  return (n/1024/1024).toFixed(2)+' MB';
}
function u8ToB64(u8){
  let s='';
  const CH=0x2000;
  for(let i=0;i<u8.length;i+=CH){
    s+=String.fromCharCode.apply(null,u8.subarray(i,i+CH));
  }
  return btoa(s);
}
function b64ToU8(b64){
  const s=atob(b64);
  const u8=new Uint8Array(s.length);
  for(let i=0;i<s.length;i++) u8[i]=s.charCodeAt(i);
  return u8;
}

/* ============ Tabs ============ */
const tabSend=document.getElementById('tabSend');
const tabRecv=document.getElementById('tabRecv');
const panelSend=document.getElementById('panelSend');
const panelRecv=document.getElementById('panelRecv');
tabSend.onclick=()=>{tabSend.classList.add('active');tabRecv.classList.remove('active');panelSend.classList.remove('hidden');panelRecv.classList.add('hidden');stopReceiving();};
tabRecv.onclick=()=>{tabRecv.classList.add('active');tabSend.classList.remove('active');panelRecv.classList.remove('hidden');panelSend.classList.add('hidden');stopSending();};

/* ============ SEND ============ */
const fileBtn=document.getElementById('fileBtn');
const fileInput=document.getElementById('fileInput');
const fileInfo=document.getElementById('fileInfo');
const chunkSizeInput=document.getElementById('chunkSize');
const chunkSizeVal=document.getElementById('chunkSizeVal');
const intervalInput=document.getElementById('interval');
const intervalVal=document.getElementById('intervalVal');
const sendBtn=document.getElementById('sendBtn');
const sFrame=document.getElementById('sFrame');
const sLoop=document.getElementById('sLoop');
const sRate=document.getElementById('sRate');
const sFps=document.getElementById('sFps');

fileBtn.onclick=()=>fileInput.click();
let currentFile=null, fileChunks=null, fileId=null;

fileInput.onchange=async ()=>{
  const f=fileInput.files[0];
  if(!f) return;
  currentFile=f;
  fileInfo.textContent=`${f.name} · ${fmtBytes(f.size)} · ${f.type||'application/octet-stream'}`;
  sendBtn.disabled=false;
  stopSending();
};

chunkSizeInput.oninput=()=>{chunkSizeVal.textContent=chunkSizeInput.value+' B';};
intervalInput.oninput=()=>{intervalVal.textContent=intervalInput.value+' ms';};

const qrTarget=document.getElementById('qrTarget');
let qrcode=new QRCode(qrTarget,{text:'ready',width:280,height:280,correctLevel:QRCode.CorrectLevel.L});

let sending=false, sendFrames=null, sendIdx=0, sendLoops=0, sendTimer=null;
let lastFrameTime=0, frameTimes=[];

async function buildFrames(){
  const size=parseInt(chunkSizeInput.value,10);
  const buf=new Uint8Array(await currentFile.arrayBuffer());
  fileId=Math.random().toString(36).slice(2,8);
  const total=Math.ceil(buf.length/size)||1;
  const meta=`M|${fileId}|${total}|${encodeURIComponent(currentFile.name)}|${encodeURIComponent(currentFile.type||'application/octet-stream')}|${buf.length}`;
  const frames=[meta];
  for(let i=0;i<total;i++){
    const chunk=buf.subarray(i*size,Math.min((i+1)*size,buf.length));
    frames.push(`D|${fileId}|${i}|${u8ToB64(chunk)}`);
  }
  return frames;
}

function drawFrame(text){
  qrcode.clear();
  qrcode.makeCode(text);
}

async function startSending(){
  sendFrames=await buildFrames();
  sendIdx=0; sendLoops=0; frameTimes=[];
  sending=true;
  sendBtn.textContent='停止傳送';
  sendBtn.classList.add('stop');
  scheduleNext();
}

function scheduleNext(){
  if(!sending) return;
  const now=performance.now();
  if(lastFrameTime){
    frameTimes.push(now-lastFrameTime);
    if(frameTimes.length>30) frameTimes.shift();
  }
  lastFrameTime=now;

  const text=sendFrames[sendIdx];
  drawFrame(text);

  const isMeta=text.startsWith('M|');
  sFrame.textContent=isMeta ? 'META' : `${sendIdx} / ${sendFrames.length-1}`;
  sLoop.textContent=sendLoops;

  const chunkBytes=parseInt(chunkSizeInput.value,10);
  const interval=Math.max(parseInt(intervalInput.value,10),1);
  const theoretical=chunkBytes/(interval/1000);
  sRate.textContent=fmtBytes(theoretical)+'/s';

  if(frameTimes.length>3){
    const avg=frameTimes.reduce((a,b)=>a+b,0)/frameTimes.length;
    sFps.textContent=(1000/avg).toFixed(1)+' fps';
  }

  sendIdx++;
  if(sendIdx>=sendFrames.length){ sendIdx=0; sendLoops++; }

  const delay=parseInt(intervalInput.value,10);
  if(delay<=0){
    sendTimer=requestAnimationFrame(scheduleNext);
  } else {
    sendTimer=setTimeout(()=>requestAnimationFrame(scheduleNext),delay);
  }
}

function stopSending(){
  sending=false;
  if(sendTimer){ clearTimeout(sendTimer); cancelAnimationFrame(sendTimer); }
  sendBtn.textContent='開始傳送';
  sendBtn.classList.remove('stop');
}

sendBtn.onclick=()=>{
  if(sending){ stopSending(); }
  else { startSending(); }
};

/* ============ RECEIVE ============ */
const video=document.getElementById('video');
const overlay=document.getElementById('overlay');
const octx=overlay.getContext('2d');
const camBtn=document.getElementById('camBtn');
const scanHint=document.getElementById('scanHint');
const cameraFacing=document.getElementById('cameraFacing');

const rName=document.getElementById('rName');
const rChunks=document.getElementById('rChunks');
const rRate=document.getElementById('rRate');
const rTime=document.getElementById('rTime');
const rProgress=document.getElementById('rProgress');
const downloadCard=document.getElementById('downloadCard');
const dName=document.getElementById('dName');
const dSize=document.getElementById('dSize');
const dLink=document.getElementById('dLink');
const resetRecvBtn=document.getElementById('resetRecvBtn');

let stream=null, scanning=false, scanRAF=null;
let recvMeta=null, recvChunks=new Map(), recvId=null;
let recvStartTime=0, rateWindow=[];
let hiddenCanvas=document.createElement('canvas');
let hctx=hiddenCanvas.getContext('2d',{willReadFrequently:true});

function resetReceiveState(){
  recvMeta=null; recvChunks=new Map(); recvId=null; rateWindow=[];
  rName.textContent='–'; rChunks.textContent='0 / –';
  rRate.textContent='0 KB/s'; rTime.textContent='0.0s';
  rProgress.style.width='0%';
  downloadCard.classList.remove('show');
  if(dLink.href){ URL.revokeObjectURL(dLink.href); dLink.removeAttribute('href'); }
}

async function startCamera(){
  try{
    stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:cameraFacing.value}, width:{ideal:1280}, height:{ideal:960}}
    });
  }catch(e){
    scanHint.textContent='無法取得相機權限:'+e.message+'(需在 HTTPS 或 localhost 開啟)';
    return;
  }
  video.srcObject=stream;
  await video.play();
  resetReceiveState();
  recvStartTime=performance.now();
  scanning=true;
  camBtn.textContent='停止相機';
  camBtn.classList.add('stop');
  scanHint.textContent='掃描中… 請將相機對準另一支手機螢幕';
  scanLoop();
}

function stopReceiving(){
  scanning=false;
  if(scanRAF) cancelAnimationFrame(scanRAF);
  if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
  camBtn.textContent='開啟相機開始接收';
  camBtn.classList.remove('stop');
  scanHint.textContent='尚未啟動相機';
  octx.clearRect(0,0,overlay.width,overlay.height);
}

function scanLoop(){
  if(!scanning) return;
  if(video.readyState===video.HAVE_ENOUGH_DATA){
    const w=video.videoWidth, h=video.videoHeight;
    if(w>0&&h>0){
      hiddenCanvas.width=w; hiddenCanvas.height=h;
      hctx.drawImage(video,0,0,w,h);
      const imgData=hctx.getImageData(0,0,w,h);
      const code=jsQR(imgData.data,w,h,{inversionAttempts:'dontInvert'});

      overlay.width=overlay.clientWidth; overlay.height=overlay.clientHeight;
      octx.clearRect(0,0,overlay.width,overlay.height);

      if(code){
        drawBox(code.location, w, h);
        handleDecoded(code.data);
      }
    }
  }
  scanRAF=requestAnimationFrame(scanLoop);
}

function drawBox(loc,vw,vh){
  const sx=overlay.width/vw, sy=overlay.height/vh;
  octx.strokeStyle='#5ee6c0'; octx.lineWidth=4;
  octx.beginPath();
  octx.moveTo(loc.topLeftCorner.x*sx, loc.topLeftCorner.y*sy);
  octx.lineTo(loc.topRightCorner.x*sx, loc.topRightCorner.y*sy);
  octx.lineTo(loc.bottomRightCorner.x*sx, loc.bottomRightCorner.y*sy);
  octx.lineTo(loc.bottomLeftCorner.x*sx, loc.bottomLeftCorner.y*sy);
  octx.closePath();
  octx.stroke();
}

function handleDecoded(text){
  const parts=text.split('|');
  const type=parts[0];
  if(type==='M'){
    const [,, id, total, name, mime, size]=[null,null,parts[1],parts[2],parts[3],parts[4],parts[5]];
    if(recvId!==id){ recvId=id; recvChunks=new Map(); recvStartTime=performance.now(); rateWindow=[]; }
    recvMeta={id,total:parseInt(total,10),name:decodeURIComponent(name),mime:decodeURIComponent(mime),size:parseInt(size,10)};
    rName.textContent=recvMeta.name;
  } else if(type==='D'){
    const id=parts[1], idx=parseInt(parts[2],10), b64=parts[3];
    if(recvId===null){ recvId=id; recvStartTime=performance.now(); }
    if(recvId!==id) return; // 不同傳輸,忽略(等 meta 重置)
    if(!recvChunks.has(idx)){
      const bytes=b64ToU8(b64);
      recvChunks.set(idx,bytes);
      const now=performance.now();
      rateWindow.push({t:now, b:bytes.length});
      while(rateWindow.length && now-rateWindow[0].t>1000) rateWindow.shift();
    }
  }
  updateProgress();
  checkComplete();
}

function updateProgress(){
  const now=performance.now();
  const elapsed=(now-recvStartTime)/1000;
  rTime.textContent=elapsed.toFixed(1)+'s';

  const bytesInWindow=rateWindow.reduce((a,c)=>a+c.b,0);
  rRate.textContent=fmtBytes(bytesInWindow)+'/s';

  if(recvMeta){
    rChunks.textContent=`${recvChunks.size} / ${recvMeta.total}`;
    const pct=Math.min(100,(recvChunks.size/recvMeta.total)*100);
    rProgress.style.width=pct+'%';
  } else {
    rChunks.textContent=`${recvChunks.size} / –`;
  }
}

function checkComplete(){
  if(!recvMeta) return;
  if(recvChunks.size < recvMeta.total) return;
  for(let i=0;i<recvMeta.total;i++){ if(!recvChunks.has(i)) return; }

  // 全部收齊,組回檔案
  const totalBytes=recvMeta.size;
  const buf=new Uint8Array(totalBytes);
  let offset=0;
  for(let i=0;i<recvMeta.total;i++){
    const c=recvChunks.get(i);
    buf.set(c,offset);
    offset+=c.length;
  }
  const blob=new Blob([buf],{type:recvMeta.mime||'application/octet-stream'});
  const url=URL.createObjectURL(blob);
  dLink.href=url;
  dLink.download=recvMeta.name||'received_file';
  dName.textContent=recvMeta.name;
  dSize.textContent=fmtBytes(blob.size);
  downloadCard.classList.add('show');

  stopReceiving();
}

camBtn.onclick=()=>{
  if(scanning){ stopReceiving(); }
  else { startCamera(); }
};
resetRecvBtn.onclick=()=>{
  resetReceiveState();
  if(!scanning) startCamera();
};
</script>
</body>
</html>
