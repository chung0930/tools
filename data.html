<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>全螢幕光學檔案傳輸</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入穩定的 QR Code 生成與解析庫 -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; overscroll-behavior: none; }
        .pixelated { image-rendering: pixelated; }
        /* 隱藏捲動條 */
        ::-webkit-scrollbar { display: none; }
        .tab-active { background-color: #0ea5e9; color: white; border-bottom: 2px solid #38bdf8;}
        .tab-inactive { background-color: transparent; color: #94a3b8; border-bottom: 2px solid transparent;}
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- 基礎設定頁面 -->
    <div id="setupView" class="flex-1 flex flex-col p-4 max-w-lg mx-auto w-full">
        <header class="text-center py-6">
            <h1 class="text-3xl font-extrabold text-sky-400 drop-shadow-md">⚡ 光學快傳</h1>
            <p class="text-sm text-slate-400 mt-2">全螢幕動態二維碼檔案傳輸協議</p>
        </header>

        <!-- 模式切換 -->
        <div class="flex w-full mb-6 border-b border-slate-700">
            <button id="btnTx" onclick="setMode('tx')" class="flex-1 py-3 font-bold tab-active transition-all">📤 我要發送</button>
            <button id="btnRx" onclick="setMode('rx')" class="flex-1 py-3 font-bold tab-inactive transition-all">📥 我要接收</button>
        </div>

        <!-- 發送端設定 -->
        <main id="txSetup" class="flex-1 flex flex-col gap-6">
            <div class="bg-slate-800 p-5 rounded-2xl shadow-xl border border-slate-700">
                <label class="block text-sm font-medium text-slate-300 mb-2">1. 選擇要傳輸的檔案</label>
                <input type="file" id="fileInput" class="block w-full text-sm text-slate-300 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-sky-600 file:text-white hover:file:bg-sky-500 mb-4 transition-colors"/>
                
                <label class="block text-sm font-medium text-slate-300 mb-2">2. 調整閃爍速率 (FPS)</label>
                <div class="flex items-center gap-4 text-sm text-slate-400 mb-2">
                    <input type="range" id="fpsInput" min="2" max="25" value="12" class="w-full accent-sky-500" oninput="document.getElementById('fpsDisplay').innerText=this.value">
                    <span class="w-16 text-right font-bold text-sky-400"><span id="fpsDisplay">12</span> FPS</span>
                </div>
                <p class="text-xs text-slate-500 mb-4">* 速率越快傳輸越快，但接收端手機若性能不足可能掉幀。</p>

                <button onclick="startTxFullscreen()" class="w-full py-4 bg-emerald-600 hover:bg-emerald-500 rounded-xl font-bold text-lg shadow-[0_0_15px_rgba(5,150,105,0.4)] transition-all">
                    ▶ 開始全螢幕發送
                </button>
            </div>
        </main>

        <!-- 接收端設定 -->
        <main id="rxSetup" class="flex-1 flex flex-col gap-6 hidden">
            <div class="bg-slate-800 p-5 rounded-2xl shadow-xl border border-slate-700 text-center">
                <div class="w-16 h-16 bg-slate-700 rounded-full flex items-center justify-center mx-auto mb-4">
                    <svg class="w-8 h-8 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                </div>
                <h3 class="text-lg font-bold text-slate-200 mb-2">準備接收檔案</h3>
                <p class="text-sm text-slate-400 mb-6">請確認瀏覽器已允許相機權限，點擊下方按鈕後，將相機對準發送端螢幕。</p>
                <button onclick="startRxFullscreen()" class="w-full py-4 bg-sky-600 hover:bg-sky-500 rounded-xl font-bold text-lg shadow-[0_0_15px_rgba(2,132,199,0.4)] transition-all">
                    📷 開啟全螢幕掃描
                </button>
            </div>
            <!-- 下載按鈕 (完成時顯示) -->
            <div id="downloadArea" class="hidden bg-emerald-900/50 p-5 rounded-2xl border border-emerald-700/50 text-center mt-4">
                <h3 class="text-emerald-400 font-bold mb-2">🎉 檔案接收完成！</h3>
                <a id="downloadBtn" class="block w-full py-3 bg-emerald-500 hover:bg-emerald-400 text-slate-900 rounded-xl font-bold transition-all shadow-lg">
                    💾 點擊儲存檔案
                </a>
            </div>
        </main>
    </div>

    <!-- ========================================== -->
    <!-- 全螢幕發送視圖 (Tx Fullscreen) -->
    <!-- ========================================== -->
    <div id="txFullscreen" class="fixed inset-0 bg-white z-50 flex flex-col items-center justify-center hidden">
        <!-- QR 碼顯示區 (利用 CSS 使其盡可能大，並保持像素化銳利邊緣) -->
        <canvas id="qrCanvas" class="w-full h-full max-w-[95vw] max-h-[95vh] object-contain pixelated"></canvas>
        
        <!-- 浮動控制面板 (半透明) -->
        <div class="absolute bottom-6 left-1/2 -translate-x-1/2 w-[90%] max-w-sm bg-black/80 backdrop-blur-md rounded-2xl p-4 border border-slate-700 shadow-2xl">
            <div class="flex justify-between items-center mb-2">
                <span class="text-sky-400 font-bold text-sm truncate" id="txFullFileName">filename.ext</span>
                <span class="text-emerald-400 font-mono text-sm" id="txFullProgress">0 / 0</span>
            </div>
            <div class="w-full bg-slate-700 rounded-full h-1.5 mb-4">
                <div id="txProgressBar" class="bg-sky-500 h-1.5 rounded-full transition-all duration-100" style="width: 0%"></div>
            </div>
            <button onclick="stopTxFullscreen()" class="w-full py-3 bg-rose-600/90 hover:bg-rose-500 text-white rounded-xl font-bold text-sm backdrop-blur-md">
                ⏹ 停止發送並退出
            </button>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- 全螢幕接收視圖 (Rx Fullscreen) -->
    <!-- ========================================== -->
    <div id="rxFullscreen" class="fixed inset-0 bg-black z-50 hidden">
        <!-- 攝影機畫面 -->
        <video id="videoElement" class="absolute inset-0 w-full h-full object-cover" playsinline></video>
        <!-- 掃描與框線繪製層 -->
        <canvas id="scanCanvas" class="absolute inset-0 w-full h-full object-cover pointer-events-none"></canvas>
        
        <!-- 浮動數據儀表板 -->
        <div class="absolute top-6 left-1/2 -translate-x-1/2 w-[90%] max-w-sm bg-black/70 backdrop-blur-md rounded-2xl p-4 border border-slate-700 shadow-2xl pointer-events-none">
            <div class="flex justify-between items-end mb-1">
                <span class="text-slate-300 text-xs">接收進度</span>
                <span id="rxFullPercent" class="text-2xl font-extrabold text-emerald-400 drop-shadow-[0_0_8px_rgba(52,211,153,0.8)]">0%</span>
            </div>
            <div class="w-full bg-slate-800 rounded-full h-2 mb-2 overflow-hidden shadow-inner">
                <div id="rxFullProgressBar" class="bg-gradient-to-r from-sky-500 to-emerald-400 h-2 rounded-full transition-all duration-200" style="width: 0%"></div>
            </div>
            <div class="grid grid-cols-2 gap-2 text-xs text-slate-300">
                <div>已解碼: <span id="rxFullChunks" class="text-sky-300 font-mono">0 / 0</span></div>
                <div>速率: <span id="rxFullSpeed" class="text-emerald-300 font-mono font-bold">0 B/s</span></div>
            </div>
        </div>

        <!-- 停止按鈕 -->
        <button onclick="stopRxFullscreen()" class="absolute bottom-8 left-1/2 -translate-x-1/2 w-[80%] max-w-xs py-4 bg-rose-600/90 hover:bg-rose-500 text-white rounded-2xl font-bold shadow-xl backdrop-blur-md">
            ⏹ 停止掃描
        </button>
    </div>


    <script>
        // --- 介面切換邏輯 ---
        function setMode(mode) {
            document.getElementById('txSetup').classList.toggle('hidden', mode !== 'tx');
            document.getElementById('rxSetup').classList.toggle('hidden', mode !== 'rx');
            document.getElementById('btnTx').className = mode === 'tx' ? 'flex-1 py-3 font-bold tab-active transition-all' : 'flex-1 py-3 font-bold tab-inactive transition-all';
            document.getElementById('btnRx').className = mode === 'rx' ? 'flex-1 py-3 font-bold tab-active transition-all' : 'flex-1 py-3 font-bold tab-inactive transition-all';
        }

        // --- 全螢幕 API 工具 ---
        function requestNativeFullscreen(elem) {
            if (elem.requestFullscreen) {
                elem.requestFullscreen().catch(err => console.log("Fullscreen API error:", err));
            } else if (elem.webkitRequestFullscreen) { /* Safari */
                elem.webkitRequestFullscreen();
            }
        }
        function exitNativeFullscreen() {
            if (document.fullscreenElement || document.webkitFullscreenElement) {
                if (document.exitFullscreen) document.exitFullscreen();
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            }
        }

        // --- Base64 / Buffer 工具 ---
        function bufferToBase64(buffer) {
            let binary = '';
            const bytes = new Uint8Array(buffer);
            const len = bytes.byteLength;
            for (let i = 0; i < len; i++) binary += String.fromCharCode(bytes[i]);
            return window.btoa(binary);
        }
        function base64ToBuffer(base64) {
            const binary_string = window.atob(base64);
            const len = binary_string.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) bytes[i] = binary_string.charCodeAt(i);
            return bytes;
        }

        // ==========================================
        // 發送端 (Tx) 邏輯
        // ==========================================
        let txInterval = null;
        let qrFrames = [];
        let currentFrameIdx = 0;
        const CHUNK_SIZE = 120; // 每個區塊 120 Bytes，保證 QR 碼密度適中，易於手機辨識

        async function startTxFullscreen() {
            const fileInput = document.getElementById('fileInput');
            if (!fileInput.files.length) return alert('請先選擇檔案');
            
            const file = fileInput.files[0];
            const arrayBuffer = await file.arrayBuffer();
            const uint8Array = new Uint8Array(arrayBuffer);
            const totalChunks = Math.ceil(uint8Array.length / CHUNK_SIZE);
            
            document.getElementById('txFullFileName').innerText = file.name;
            qrFrames = [];

            // 打包資料: [總數]|[索引]|[檔名(僅索引0)]|[Base64資料]
            for (let i = 0; i < totalChunks; i++) {
                const chunkData = uint8Array.slice(i * CHUNK_SIZE, (i + 1) * CHUNK_SIZE);
                const base64Data = bufferToBase64(chunkData);
                let payload = `${totalChunks}|${i}|`;
                if (i === 0) payload += `${file.name}|`; 
                payload += base64Data;
                qrFrames.push(payload);
            }

            // 開啟全螢幕 UI
            const txView = document.getElementById('txFullscreen');
            txView.classList.remove('hidden');
            requestNativeFullscreen(document.documentElement);

            // 開始輪播
            currentFrameIdx = 0;
            const fps = parseInt(document.getElementById('fpsInput').value);
            const intervalMs = 1000 / fps;
            const canvas = document.getElementById('qrCanvas');

            txInterval = setInterval(() => {
                const text = qrFrames[currentFrameIdx];
                // 使用 qrcode.js 繪製 (設定 width 確保基礎解析度，再由 CSS 放至全螢幕)
                QRCode.toCanvas(canvas, text, { 
                    width: 400, 
                    margin: 2, 
                    color: { dark: '#000000', light: '#ffffff' }, 
                    errorCorrectionLevel: 'L' // 容錯率 L (7%) 讓資料裝最多，方塊最大
                }, function (error) {
                    if (error) console.error(error);
                });
                
                // 更新進度顯示
                document.getElementById('txFullProgress').innerText = `${currentFrameIdx + 1} / ${totalChunks}`;
                document.getElementById('txProgressBar').style.width = `${((currentFrameIdx + 1)/totalChunks)*100}%`;
                
                currentFrameIdx = (currentFrameIdx + 1) % totalChunks; 
            }, intervalMs);
        }

        function stopTxFullscreen() {
            if (txInterval) clearInterval(txInterval);
            txInterval = null;
            document.getElementById('txFullscreen').classList.add('hidden');
            exitNativeFullscreen();
        }


        // ==========================================
        // 接收端 (Rx) 邏輯
        // ==========================================
        let videoStream = null;
        let rxAnimFrame = null;
        let receivedChunks = new Set();
        let fileDataArray = [];
        let expectedTotal = 0;
        let incomingFileName = 'download.bin';
        
        let lastReceivedTime = performance.now();
        let bytesReceivedSinceLastCalc = 0;

        async function startRxFullscreen() {
            const video = document.getElementById('videoElement');
            const canvas = document.getElementById('scanCanvas');
            
            try {
                // 要求相機權限 (優先使用後置鏡頭，解析度設高有利於辨識)
                videoStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } } 
                });
                video.srcObject = videoStream;
                video.play();
                
                // 重置狀態
                receivedChunks.clear();
                fileDataArray = [];
                expectedTotal = 0;
                document.getElementById('downloadArea').classList.add('hidden');
                updateRxUI(0);
                
                // 開啟全螢幕 UI
                document.getElementById('rxFullscreen').classList.remove('hidden');
                requestNativeFullscreen(document.documentElement);
                
                // 開始解析迴圈
                requestAnimationFrame(scanFrame);
            } catch (err) {
                alert('無法開啟相機，請確保網頁為 HTTPS 且允許相機權限。\n' + err.message);
            }
        }

        function stopRxFullscreen() {
            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
                videoStream = null;
            }
            if (rxAnimFrame) cancelAnimationFrame(rxAnimFrame);
            document.getElementById('rxFullscreen').classList.add('hidden');
            exitNativeFullscreen();
        }

        function scanFrame() {
            if (!videoStream) return;
            const video = document.getElementById('videoElement');
            const canvas = document.getElementById('scanCanvas');
            const ctx = canvas.getContext('2d', { willReadFrequently: true });

            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                // 確保 Canvas 解析度與影片來源一致，才能準確畫出框線
                if(canvas.width !== video.videoWidth || canvas.height !== video.videoHeight){
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                }
                
                // 將影像畫到 Canvas 以擷取像素
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                
                // 執行 jsQR 解碼
                const code = jsQR(imageData.data, imageData.width, imageData.height, {
                    inversionAttempts: "dontInvert", // 關閉反轉以提升效能
                });

                if (code && code.data) {
                    // 畫出成功辨識的追蹤框 (UI回饋)
                    ctx.beginPath();
                    ctx.moveTo(code.location.topLeftCorner.x, code.location.topLeftCorner.y);
                    ctx.lineTo(code.location.topRightCorner.x, code.location.topRightCorner.y);
                    ctx.lineTo(code.location.bottomRightCorner.x, code.location.bottomRightCorner.y);
                    ctx.lineTo(code.location.bottomLeftCorner.x, code.location.bottomLeftCorner.y);
                    ctx.lineTo(code.location.topLeftCorner.x, code.location.topLeftCorner.y);
                    ctx.lineWidth = 6;
                    ctx.strokeStyle = "#10b981"; // Emerald green
                    ctx.stroke();

                    // 處理資料
                    processDecodedData(code.data);
                }
            }
            rxAnimFrame = requestAnimationFrame(scanFrame);
        }

        function processDecodedData(dataStr) {
            const parts = dataStr.split('|');
            if (parts.length < 3) return;

            const total = parseInt(parts[0]);
            const index = parseInt(parts[1]);
            
            if (expectedTotal === 0) {
                expectedTotal = total;
                fileDataArray = new Array(total);
            }

            if (!receivedChunks.has(index)) {
                let base64Data = "";
                if (index === 0 && parts.length >= 4) {
                    incomingFileName = parts[2];
                    base64Data = parts[3];
                } else {
                    base64Data = parts[2];
                }

                fileDataArray[index] = base64Data;
                receivedChunks.add(index);
                
                // 速率計算輔助
                bytesReceivedSinceLastCalc += base64Data.length;
                updateRxUI();

                // 判斷是否接收完成
                if (receivedChunks.size === expectedTotal) {
                    finishReceiving();
                }
            }
        }

        // 速率計算計時器 (每秒更新一次)
        setInterval(() => {
            if(receivedChunks.size > 0 && expectedTotal > 0 && receivedChunks.size < expectedTotal) {
                const now = performance.now();
                const diff = (now - lastReceivedTime) / 1000;
                if(diff >= 1) {
                    let speed = bytesReceivedSinceLastCalc / diff;
                    // 單位轉換
                    let speedStr = speed > 1024 ? (speed/1024).toFixed(1) + ' KB/s' : speed.toFixed(0) + ' B/s';
                    document.getElementById('rxFullSpeed').innerText = speedStr;
                    
                    bytesReceivedSinceLastCalc = 0;
                    lastReceivedTime = now;
                }
            }
        }, 1000);

        function updateRxUI() {
            if (expectedTotal === 0) return;
            const percent = (receivedChunks.size / expectedTotal) * 100;
            document.getElementById('rxFullPercent').innerText = `${percent.toFixed(1)}%`;
            document.getElementById('rxFullProgressBar').style.width = `${percent}%`;
            document.getElementById('rxFullChunks').innerText = `${receivedChunks.size} / ${expectedTotal}`;
        }

        function finishReceiving() {
            stopRxFullscreen();
            
            // 組合資料
            let totalLength = 0;
            const buffers = [];
            for (let i = 0; i < expectedTotal; i++) {
                // 防呆：如果有漏掉的區塊 (邏輯上不會發生，因為 size === expectedTotal 才會進來)
                if(!fileDataArray[i]) continue; 
                const buf = base64ToBuffer(fileDataArray[i]);
                buffers.push(buf);
                totalLength += buf.length;
            }

            const completeArray = new Uint8Array(totalLength);
            let offset = 0;
            for (const buf of buffers) {
                completeArray.set(buf, offset);
                offset += buf.length;
            }

            // 產生 Blob 與下載連結
            const blob = new Blob([completeArray], { type: "application/octet-stream" });
            const url = URL.createObjectURL(blob);
            
            // 顯示下載區塊
            const dlArea = document.getElementById('downloadArea');
            const dlBtn = document.getElementById('downloadBtn');
            dlArea.classList.remove('hidden');
            dlBtn.href = url;
            dlBtn.download = incomingFileName || 'received_file.bin';
        }
    </script>
</body>
</html>
